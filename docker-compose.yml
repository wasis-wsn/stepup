services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: stepup-app
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - .:/var/www/html
    environment:
      APP_NAME: "STEPUP"
      APP_ENV: local
      APP_KEY: "base64:3wa9nWJ2F67Uy0NUjEEOKNe1wK6WYz7/yW1wXuUvg9o="
      APP_DEBUG: "true"
      APP_URL: "http://localhost:8000"
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: stepup
      DB_USERNAME: stepup
      DB_PASSWORD: stepup
      PHP_CLI_SERVER_WORKERS: 4
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - stepup-network

  mysql:
    image: mysql:8.0
    container_name: stepup-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: stepup
      MYSQL_USER: stepup
      MYSQL_PASSWORD: stepup
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - stepup-mysql-data:/var/lib/mysql
    networks:
      - stepup-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: stepup-phpmyadmin
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_ARBITRARY: 1
      UPLOAD_LIMIT: 64M
    ports:
      - "8085:80"
    networks:
      - stepup-network

networks:
  stepup-network:
    driver: bridge

volumes:
  stepup-mysql-data:
    driver: local
