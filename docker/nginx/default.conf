# ==============================================================================
# STEPUP - Production Nginx Configuration
# High-Performance Web & Reverse Proxy for Laravel SPA & API
# ==============================================================================

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=stepup_general:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=stepup_api:10m rate=20r/s;

server {
    listen 80;
    listen [::]:80;
    server_name localhost _;

    root /var/www/html/public;
    index index.php index.html;

    charset utf-8;
    client_max_body_size 32M;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Static Assets Caching (Vite build assets: JS, CSS, Fonts, Images)
    location ~* \.(?:ico|css|js|gif|jpe?g|png|webp|avif|svg|woff2?|eot|ttf|otf)$ {
        expires 365d;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Access-Control-Allow-Origin "*" always;
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Public Storage uploaded media & product images
    location ^~ /storage/ {
        alias /var/www/html/storage/app/public/;
        expires 30d;
        access_log off;
        add_header Cache-Control "public, max-age=2592000";
        add_header Access-Control-Allow-Origin "*" always;
    }

    # API endpoints with rate limiting
    location ^~ /api/ {
        limit_req zone=stepup_api burst=40 nodelay;
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Standard Laravel Routing & SPA fallback
    location / {
        limit_req zone=stepup_general burst=60 nodelay;
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /favicon.svg { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    # FastCGI PHP-FPM Proxy
    location ~ \.php$ {
        fastcgi_pass stepup-prod-app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param HTTP_X_FORWARDED_FOR $proxy_add_x_forwarded_for;
        fastcgi_param HTTP_X_FORWARDED_PROTO $http_x_forwarded_proto;
        fastcgi_param HTTP_X_FORWARDED_HOST $http_host;

        fastcgi_connect_timeout 60s;
        fastcgi_send_timeout 120s;
        fastcgi_read_timeout 120s;
        fastcgi_buffer_size 128k;
        fastcgi_buffers 4 256k;
        fastcgi_busy_buffers_size 256k;
    }

    # Deny access to hidden files and dotfiles (.git, .env, .htaccess)
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
